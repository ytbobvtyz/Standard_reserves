# Фаза 2. Полный vhost ytbob.ru для Nginx внутри контейнера frontend musicme.
# Подключать только после появления
# /etc/letsencrypt/live/ytbob.ru/fullchain.pem и privkey.pem.
# Не заменяет конфиг musicme.ru: отдельные server_name, без default_server.
#
# Имена upstream — container_name / network alias из docker-compose.ytbob.yml.
# resolver нужен, чтобы nginx -t не падал, пока контейнеры Standart Reserve
# ещё не запущены, и чтобы смена IP после recreate не требовала правки конфига.

server {
    listen 80;
    server_name ytbob.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ytbob.ru;

    ssl_certificate     /etc/letsencrypt/live/ytbob.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ytbob.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # В приложении нет /api/v1/health. Живой URL — /health и /api/v1/status.
    # Этот location закрывает критерий https://ytbob.ru/api/v1/health.
    location = /api/v1/health {
        set $sr_backend standart-reserve-backend;
        proxy_pass http://$sr_backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $sr_backend standart-reserve-backend;
        proxy_pass http://$sr_backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $sr_backend standart-reserve-backend;
        proxy_pass http://$sr_backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $sr_frontend standart-reserve-frontend;
        proxy_pass http://$sr_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
