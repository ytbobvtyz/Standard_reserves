# Фаза 1. Только HTTP, без ssl_certificate.
# Подключать ДО выпуска сертификата. Не подключать вместе с nginx/ytbob.conf:
# оба файла объявляют server_name ytbob.ru на порту 80.
#
# Этот блок не default_server и не трогает musicme.ru.

server {
    listen 80;
    server_name ytbob.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
