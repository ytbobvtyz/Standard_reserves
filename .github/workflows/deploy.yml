name: Deploy production

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, standart-reserve-prod]
    environment: production
    timeout-minutes: 45
    env:
      SERVER_ENV_DIR: /opt/standart-reserve
      COMPOSE_FILE: docker-compose.prod.yml

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Attach server secrets
        run: |
          set -euo pipefail
          env_file="${SERVER_ENV_DIR}/.env"
          if [ ! -f "${env_file}" ]; then
            echo "::error::Нет ${env_file}. DevOps создаёт его скриптом deploy/install-runner.sh."
            exit 1
          fi
          if grep -Eq '^POSTGRES_PASSWORD=(change-me-strong-password)?$' "${env_file}"; then
            echo "::error::В ${env_file} не задан POSTGRES_PASSWORD."
            exit 1
          fi
          domain="$(grep -E '^DOMAIN=' "${env_file}" | tail -1 | cut -d= -f2- | tr -d '\"' | tr -d "'" || true)"
          if [ -z "${domain}" ] || [ "${domain}" = "localhost" ]; then
            echo "::error::В ${env_file} нужен боевой DOMAIN (Traefik маршрутизирует по Host)."
            exit 1
          fi
          traefik_network="$(grep -E '^TRAEFIK_NETWORK=' "${env_file}" | tail -1 | cut -d= -f2- | tr -d '\"' | tr -d "'" || true)"
          traefik_network="${traefik_network:-traefik}"
          if ! docker network inspect "${traefik_network}" >/dev/null 2>&1; then
            echo "::error::Нет Docker-сети ${traefik_network}. Traefik должен быть поднят на сервере до деплоя."
            exit 1
          fi
          ln -sfn "${env_file}" .env
          echo "DOMAIN=${domain}"
          echo "TRAEFIK_NETWORK=${traefik_network}"

      - name: Deploy stack
        run: |
          set -euo pipefail
          if docker compose up -h 2>&1 | grep -q -- '--wait'; then
            docker compose -f "${COMPOSE_FILE}" up -d --build --remove-orphans --wait --wait-timeout 180
          else
            docker compose -f "${COMPOSE_FILE}" up -d --build --remove-orphans
          fi

      - name: Health check
        run: |
          set -euo pipefail
          env_file="${SERVER_ENV_DIR}/.env"
          domain="$(grep -E '^DOMAIN=' "${env_file}" | tail -1 | cut -d= -f2- | tr -d '\"' | tr -d "'" || true)"

          echo "Проверка backend в контейнере..."
          docker compose -f "${COMPOSE_FILE}" exec -T backend curl -fsS http://localhost:8000/health
          echo

          echo "Проверка ingress Traefik (${domain})..."
          if curl -fskS --connect-timeout 5 --max-time 15 "https://${domain}/health"; then
            echo
            exit 0
          fi
          if curl -fsS --connect-timeout 5 --max-time 15 "http://${domain}/health"; then
            echo
            exit 0
          fi
          if curl -fskS --connect-timeout 5 --max-time 15 --resolve "${domain}:443:127.0.0.1" "https://${domain}/health"; then
            echo
            exit 0
          fi
          if curl -fsS --connect-timeout 5 --max-time 15 --resolve "${domain}:80:127.0.0.1" "http://${domain}/health"; then
            echo
            exit 0
          fi
          if curl -fskS --connect-timeout 5 --max-time 15 -H "Host: ${domain}" "https://127.0.0.1/health"; then
            echo
            exit 0
          fi
          if curl -fsS --connect-timeout 5 --max-time 15 -H "Host: ${domain}" "http://127.0.0.1/health"; then
            echo
            exit 0
          fi
          echo "::error::Контейнер жив, но Traefik не отдаёт /health для Host=${domain}."
          docker compose -f "${COMPOSE_FILE}" ps
          docker compose -f "${COMPOSE_FILE}" logs --tail=80
          exit 1

      - name: Remove dangling images
        if: success()
        continue-on-error: true
        run: docker image prune -f
