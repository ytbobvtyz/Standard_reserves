[project]
name = "standart-reserve-backend"
version = "0.1.0"
description = "Standart Reserve — backend API"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations/script.py.mako"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
